[pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = test_*.py
testpaths = tests
# --reuse-db locally (BACKEND_PLAN.md section 9); CI passes --create-db.
addopts =
    --reuse-db
    --strict-markers
    -ra
markers =
    concurrency: uses two real connections and threads; needs transaction=True
