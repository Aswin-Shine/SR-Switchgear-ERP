services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: srerp
      POSTGRES_USER: srerp
      POSTGRES_PASSWORD: srerp
      # The application pins the connection timezone too; this keeps psql
      # sessions and CURRENT_DATE consistent for anyone poking at the database
      # by hand.
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srerp -d srerp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # D9: MinIO for development. The production object store is undecided.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      # Dockerfile COPYs from both backend/ and frontend/ (it builds the SPA
      # in a stage of its own), so the build context has to be the repo root,
      # not this directory — compose.yaml resolves `context` relative to
      # itself, hence "..".
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_HOST: db
      POSTGRES_DB: srerp
      POSTGRES_USER: srerp
      POSTGRES_PASSWORD: srerp
      DJANGO_SECRET_KEY: dev-only-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      STORAGE_BACKEND: s3
      AWS_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"

volumes:
  pgdata:
  miniodata:
